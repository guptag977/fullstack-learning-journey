<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet"href=style.css>
</head>
<body>
<div class="form-container">
    <h2>User Registration Form</h2>
    <form action="#" method="post">
<div class="form-group">
    <label for="Full Name">Full Name</label>
    
<input type="Text" id="fullName" Name="FullName" placeholder="Enter Your Full Name"required>
</div>
<div Class="form-group">
    <label for="Email">Email</label>
    <input type="Email" id=" Email" Name=" Email"placeholder="Enter your Email"required>
<div Class="Form-Group">
    <label for input type="Password">Password</label>
    <input type="Password" id =password" Name="password" Placeholder="Enter Your Paassword" Required>
</div>

<div Class="Form-Group">
    <label for input type="Password">Confirm Password</label>
    <input type="Password" id =confirmPassword" Name="confirmPassword" Placeholder="Enter Your Confirm Paassword" Required>
    </div>
<div Class="Form-Group">
    <label for="Gender">Gender</label>
        <div class="radio-Group">
            <input type="radio" id="male" Name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="femail" Name="gender" value="femail" required>
            <label for="femail">Female</label>

            <input Type="Radio" id ="Other" Name="Gender" value="Other"required>
            <label for="other">Other</label><label for=""></label>

        </div>
<div class="Form-group">
    <label for="Country">Country:</label>
    <select id ="country" Name="Country"Required>
    <option value="">Select Your Country</option>
    <option value="India">India</option>
    <option value="USA">USA</option>
    <option value="UK">UK</option>
   </select>

<div class="form Group">
   <label for="Skill">Skill</label>
        <div class="Checkbox-Group">
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="HTML">HTML</label>

        <input type="checkbox" ID="CSS" Name="Skill" Vaue="CSS">
        <label for="CSS">CSS</label>
            
        <input type="checkbox" ID="js" Name="Skill" Value="Java Script">
        <label for="JS">Java Script</label>
            
        </div>
</div>
<button Type="submit" Class="submit-btn">Register Now</button>
</form>
</div>
        



</div>

</div>

    
</body>
</html>
